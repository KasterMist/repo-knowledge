name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@12.2.1 --ignore-scripts
      - name: Install locked dependencies
        run: npm ci
      - name: Check source, MCP and actual VSIX
        run: npm run check
      - name: Upload unreleased test candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repo-knowledge-candidate-${{ matrix.os }}
          path: |
            dist/repo-knowledge-0.0.0.vsix
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  remote-node-runtime:
    name: remote MCP runtime (Node 22.22.1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@12.2.1 --ignore-scripts
      - name: Install locked dependencies
        run: npm ci
      - name: Build with the development toolchain
        run: npm run build
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.1
          package-manager-cache: false
      - name: Exercise bundled service under remote runtime baseline
        run: node --test tests/integration/mcp.test.mjs
